// 出題順の均等化（重複防止プール）
let questionPools = {};

function getNextQuestionFromPool(key, dataList) {
  if (!questionPools[key] || questionPools[key].length === 0) {
    questionPools[key] = [...dataList].sort(() => 0.5 - Math.random());
  }
  return questionPools[key].pop();
}

function getPokemonImageUrl(id) { return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/${id}.gif`; }

let isAppliedMode = false;
let baseState = { exp: 0, keys: 0, isEvolved: false, partnerId: 133, partnerName: "イーブイ", foods: [] };
let appliedState = { exp: 0, keys: 0, stage: 0, familyIdx: -1, foods: [] };

let synthVoices = [];

const roomView = document.getElementById('room-view'), quizView = document.getElementById('quiz-view');
const foodListEl = document.getElementById('food-list'), expText = document.getElementById('exp-text'), expBar = document.getElementById('exp-bar');
const partnerImg = document.getElementById('partner-image'), partnerName = document.getElementById('partner-name');
const resetGameBtn = document.getElementById('reset-game-btn');
const partnerStage = document.getElementById('partner-stage');

function playDoubleJumpSound(callback) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) { if(callback) callback(); return; }
    const ctx = new AudioCtx();
    
    function playSingle(time) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(180, time);
      osc.frequency.exponentialRampToValueAtTime(600, time + 0.12);
      gain.gain.setValueAtTime(0.3, time);
      gain.gain.linearRampToValueAtTime(0.01, time + 0.12);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(time);
      osc.stop(time + 0.12);
    }
    
    const now = ctx.currentTime;
    playSingle(now);
    playSingle(now + 0.2);
    
    setTimeout(() => {
      if(callback) callback();
    }, 450);
  } catch(e) {
    if(callback) callback();
  }
}

function initBaseMode() {
  baseState = { exp: 0, keys: 0, isEvolved: false, partnerId: 133, partnerName: "イーブイ", foods: [] };
  baseState.foods = [...allFoods].sort(() => 0.5 - Math.random()).slice(0, 4).map(f => ({ ...f, isEaten: false }));
}
function initAppliedMode() {
  appliedState = { exp: 0, keys: 0, stage: 0, familyIdx: Math.floor(Math.random() * pokemonFamilies.length), foods: [] };
  appliedState.foods = [...allFoods].sort(() => 0.5 - Math.random()).slice(0, 4).map(f => ({ ...f, isEaten: false }));
}

function getCurrentPoke() {
  if (!isAppliedMode) {
    return { id: baseState.partnerId, name: baseState.partnerName };
  } else {
    const family = pokemonFamilies[appliedState.familyIdx];
    if (appliedState.stage === 0) return family.stage0;
    if (appliedState.stage === 1) return family.stage1;
    return family.stage2;
  }
}

function updateStageBackground() {
  partnerStage.classList.remove('bg-lovely', 'bg-sea', 'bg-cool');
  
  if (!isAppliedMode) {
    if (baseState.isEvolved) {
      partnerStage.classList.add('bg-cool');
    } else {
      partnerStage.classList.add('bg-lovely');
    }
  } else {
    if (appliedState.stage === 0) {
      partnerStage.classList.add('bg-lovely');
    } else if (appliedState.stage === 1) {
      partnerStage.classList.add('bg-sea');
    } else {
      partnerStage.classList.add('bg-cool');
    }
  }
}

function renderRoom() {
  foodListEl.innerHTML = "";
  const currentPoke = getCurrentPoke();
  partnerImg.src = getPokemonImageUrl(currentPoke.id);
  partnerName.innerText = currentPoke.name;
  
  updateStageBackground();
  
  const currentState = isAppliedMode ? appliedState : baseState;
  expText.innerText = currentState.exp; expBar.style.width = currentState.exp + "%";
  
  if ((!isAppliedMode && baseState.isEvolved) || (isAppliedMode && appliedState.stage === 2)) {
    resetGameBtn.style.display = 'inline-flex';
  } else {
    resetGameBtn.style.display = 'none';
  }
  
  currentState.foods.forEach((food, index) => {
    const isUnlocked = currentState.keys > index;
    const foodEl = document.createElement('div');
    if (food.isEaten) { foodEl.className = 'food-item eaten'; foodEl.innerText = food.emoji; }
    else if (!isUnlocked) { foodEl.className = 'food-item locked'; foodEl.innerText = food.emoji; }
    else { 
      foodEl.className = 'food-item'; foodEl.innerText = food.emoji; 
      if ((!isAppliedMode && !baseState.isEvolved) || (isAppliedMode && appliedState.stage < 2)) {
        foodEl.onclick = () => feedPartner(index, foodEl); 
      }
    }
    foodListEl.appendChild(foodEl);
  });
}

let commentTimeout = null;
function interactPokemon() {
  const commentBox = document.getElementById('poke-comment');
  if (commentBox.style.opacity === "1") { commentBox.style.opacity = "0"; clearTimeout(commentTimeout); return; }
  if (partnerImg.classList.contains('anim-jump') || partnerImg.classList.contains('anim-spin') || partnerImg.classList.contains('anim-shake') || partnerImg.classList.contains('anim-chew')) return;
  
  commentBox.innerText = pokeComments[Math.floor(Math.random() * pokeComments.length)];
  commentBox.style.opacity = "1";
  commentTimeout = setTimeout(() => { commentBox.style.opacity = "0"; }, 3000);
  
  const rand = Math.floor(Math.random() * 5);
  if (rand === 0) { partnerImg.classList.add('anim-jump'); setTimeout(() => partnerImg.classList.remove('anim-jump'), 400); }
  else if (rand === 1) { partnerImg.classList.add('anim-spin'); setTimeout(() => partnerImg.classList.remove('anim-spin'), 500); }
  else if (rand === 2) { partnerImg.classList.add('anim-shake'); setTimeout(() => partnerImg.classList.remove('anim-shake'), 400); }
  else if (rand === 3) { spawnEffects(); partnerImg.classList.add('anim-jump'); setTimeout(() => partnerImg.classList.remove('anim-jump'), 400); }
  else {
    const pokeId = getCurrentPoke().id;
    const audio = new Audio(`https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${pokeId}.ogg`);
    audio.volume = 0.5; audio.play().catch(e => console.log(e));
    partnerImg.classList.add('anim-shake'); setTimeout(() => partnerImg.classList.remove('anim-shake'), 400);
  }
}

function spawnEffects() {
  const emoji = effectEmojis[Math.floor(Math.random() * effectEmojis.length)];
  for(let i=0; i<4; i++) {
    const h = document.createElement('div'); h.innerText = emoji; h.className = 'effect-anim';
    h.style.left = (35 + Math.random()*30) + '%'; h.style.animationDelay = (Math.random()*0.2) + 's';
    partnerStage.appendChild(h); setTimeout(() => h.remove(), 1000);
  }
}

function feedPartner(index, element) {
  const currentState = isAppliedMode ? appliedState : baseState;
  if (currentState.foods[index].isEaten) return;
  
  const flying = document.createElement('div'); flying.innerText = element.innerText; flying.className = 'flying-food';
  const rect = element.getBoundingClientRect(); flying.style.left = rect.left + 'px'; flying.style.top = rect.top + 'px';
  document.body.appendChild(flying);
  element.classList.add('eaten'); currentState.foods[index].isEaten = true;
  
  setTimeout(() => {
    const pRect = partnerImg.getBoundingClientRect();
    flying.style.left = (pRect.left + pRect.width/2 - 20) + 'px'; flying.style.top = (pRect.top + pRect.height/2 - 20) + 'px';
    flying.style.transform = 'scale(0.5) rotate(360deg)'; flying.style.opacity = '0';
  }, 50);

  setTimeout(() => {
    flying.remove();
    const msg = document.getElementById('eating-msg'); msg.style.opacity = 1; msg.style.transform = "translate(-50%, -20px)"; partnerImg.classList.add("anim-chew");
    spawnEffects();
    
    setTimeout(() => {
      msg.style.opacity = 0; msg.style.transform = "translate(-50%, 0)"; partnerImg.classList.remove("anim-chew");
      currentState.exp = Math.min(100, currentState.exp + 25);
      
      if (!isAppliedMode) {
        if (baseState.exp === 100 && !baseState.isEvolved) {
          baseState.isEvolved = true;
          const evo = eeveeEvolutions[Math.floor(Math.random() * eeveeEvolutions.length)];
          baseState.partnerId = evo.id; baseState.partnerName = evo.name;
          evolveAnim(evo);
        } else { renderRoom(); }
      } else {
        const family = pokemonFamilies[appliedState.familyIdx];
        if (appliedState.exp === 50 && appliedState.stage === 0) { appliedState.stage = 1; evolveAnim(family.stage1); }
        else if (appliedState.exp === 100 && appliedState.stage === 1) { appliedState.stage = 2; evolveAnim(family.stage2); }
        else { renderRoom(); }
      }
    }, 1000);
  }, 550);
}

function evolveAnim(targetPoke) {
  document.getElementById('evolve-image').src = getPokemonImageUrl(targetPoke.id);
  document.getElementById('evolve-text').innerHTML = `おめでとう！<br>${targetPoke.name} に しんかした！`;
  document.getElementById('evolve-overlay').classList.add('show');
  const audio = new Audio(`https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${targetPoke.id}.ogg`);
  audio.volume = 0.5; audio.play().catch(e => console.log(e));
  renderRoom();
}

};

document.getElementById('mode-toggle-btn').onclick = () => {
  isAppliedMode = !isAppliedMode;

    document.body.classList.remove('mode-applied');
    document.getElementById('main-title').innerText = "こくご かんたんクイズ";
    document.getElementById('start-quiz-btn').innerText = "かんたんクイズ (4もん)";
    document.getElementById('mode-toggle-btn').innerHTML = "🔄 チャレンジクイズにきりかえ";
  } else {
    document.body.classList.add('mode-applied');
    if (appliedState.familyIdx === -1) initAppliedMode();
    document.getElementById('main-title').innerText = "こくご チャレンジクイズ";
    document.getElementById('start-quiz-btn').innerText = "チャレンジクイズ (4もん)";
    document.getElementById('mode-toggle-btn').innerHTML = "🔄 かんたんクイズにきりかえ";
  }
  renderRoom();
};

let currentQIndex = 0;

document.getElementById('start-quiz-btn').onclick = () => {
  roomView.classList.add('hidden'); quizView.classList.remove('hidden'); currentQIndex = 0;
  showNextQuestion();
};

function showNextQuestion() {
  if (currentQIndex >= 4) {
    const currentState = isAppliedMode ? appliedState : baseState;
    currentState.keys++;
    quizView.classList.add('hidden'); roomView.classList.remove('hidden'); 
    renderRoom(); 
    return;
  }
  
  document.getElementById('quiz-progress-text').innerText = `だい ${currentQIndex + 1} もん！`;
  const contentEl = document.getElementById('quiz-content'); contentEl.innerHTML = "";
  
  if (!isAppliedMode) {
    if (currentQIndex === 0) renderQuestionCard(contentEl, baseQ1, "あてはまる ことばを<br>えらぼう！", "baseQ1");
    else if (currentQIndex === 1) renderQuestionCard(contentEl, baseQ2, "なんて よむかな？", "baseQ2");
    else if (currentQIndex === 2) renderQuestionCard(contentEl, baseQ3, "かぞえかたを<br>えらぼう！", "baseQ3");
    else renderQuestionCard(contentEl, baseQ4, "はんたいの ことばを<br>えらぼう！", "baseQ4");
  } else {
    if (currentQIndex === 0) renderQuestionCard(contentEl, appliedQ1, "かんじを よんでみよう！", "appliedQ1");
    else if (currentQIndex === 1) renderQuestionCard(contentEl, appliedQ2, "ぴったりな ことばを<br>えらぼう！", "appliedQ2");
    else if (currentQIndex === 2) renderQuestionCard(contentEl, appliedQ3, "グループの なかまを<br>えらぼう！", "appliedQ3");
    else renderQuestionCard(contentEl, appliedQ4, "ことわざを えらぼう！", "appliedQ4");
  }
}

function renderQuestionCard(container, dataList, titleText, poolKey) {
  const q = getNextQuestionFromPool(poolKey, dataList);
  
  container.innerHTML = `
    <div style="display:flex; justify-content:center; align-items:center; gap:10px;">
      <p class="question-sub" style="margin:0;">${titleText}</p>
      <button class="voice-btn" id="q-voice-btn">🔊</button>
    </div>
    <div class="question-word">${q.text}</div>
    <div class="options-grid" id="q-opts"></div>
  `;

  document.getElementById('q-voice-btn').onclick = () => {
    let cleanText = q.text.replace(/<br>/g, ' ').replace(/[。、]/g, '');
    // 絵文字や拡張Unicode記号を確実に削除
    cleanText = cleanText.replace(/[\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]/gu, '');

    if (q.type !== 'opp') {
      cleanText = cleanText.replace(/「[^」]+」/g, 'これ');
    }

    const hasBlank = cleanText.includes('( ___ )');

    if (hasBlank) {
      const parts = cleanText.split('( ___ )');
      speakJapaneseVoice(parts[0].trim());
      
      setTimeout(() => {
        playDoubleJumpSound(() => {
          if (parts[1] && parts[1].trim()) {
            setTimeout(() => { speakJapaneseVoice(parts[1].trim()); }, 300);
          }
        });
      }, 500);
    } else {
      speakJapaneseVoice(cleanText);
    }
  };

  const optsGrid = document.getElementById('q-opts');
  q.options.slice().sort(() => 0.5 - Math.random()).forEach(opt => {
    const btn = document.createElement('div'); btn.className = 'option-btn'; btn.innerText = opt;
    btn.onclick = () => checkAnswer(opt === q.correct, q.correct);
    optsGrid.appendChild(btn);
  });

  setTimeout(() => {
    document.getElementById('q-voice-btn').click();
  }, 300);
}

function speakJapaneseVoice(text) {
  if (!text) return;
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = 'ja-JP';
  if (synthVoices.length === 0) synthVoices = window.speechSynthesis.getVoices();
  const jaVoice = synthVoices.find(v => v.lang.startsWith('ja'));
  if (jaVoice) msg.voice = jaVoice;
  msg.pitch = 1.1; msg.rate = 0.9;
  window.speechSynthesis.speak(msg);
}

function speakEnglishVoice(text) {
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = 'en-US';
  if (synthVoices.length === 0) synthVoices = window.speechSynthesis.getVoices();
  const enVoice = synthVoices.find(v => v.lang.startsWith('en'));
  if (enVoice) msg.voice = enVoice;
  msg.pitch = 1.1; msg.rate = 0.8;
  window.speechSynthesis.speak(msg);
}

function checkAnswer(isCorrect, answerText) {
  const overlay = document.getElementById('feedback-overlay'), icon = document.getElementById('feedback-icon'), text = document.getElementById('feedback-text');
  
  if (isCorrect) {
    icon.innerText = "⭕"; icon.style.color = "var(--correct)";
    text.innerHTML = `${correctTexts[Math.floor(Math.random() * correctTexts.length)]}<br><span style="font-size:1.8rem; color:var(--primary-shadow); display:block; margin-top:10px;">${answerText}</span>`;
    text.style.color = "var(--correct)";
    
    const voice = correctVoices[Math.floor(Math.random() * correctVoices.length)];
    if (/[a-zA-Z]/.test(voice)) speakEnglishVoice(voice);
    else speakJapaneseVoice(voice);
  } else {
    icon.innerText = "❌"; icon.style.color = "var(--incorrect)";
    text.innerHTML = `${incorrectTexts[Math.floor(Math.random() * incorrectTexts.length)]}<br><span style="font-size:1.2rem; color:#666; display:block; margin-top:10px;">せいかいは：</span><span style="font-size:1.8rem; color:var(--primary-shadow); display:block;">${answerText}</span>`;
    text.style.color = "var(--incorrect)";
    
    const voice = incorrectVoices[Math.floor(Math.random() * incorrectVoices.length)];
    if (/[a-zA-Z]/.test(voice)) speakEnglishVoice(voice);
    else speakJapaneseVoice(voice);
  }
  
  overlay.classList.add('show');
  
  setTimeout(() => {
    overlay.classList.remove('show');
    if (isCorrect) {
      currentQIndex++;
      showNextQuestion();
    }
  }, 1800); 
}

window.onload = () => { 
  initBaseMode(); 
  initAppliedMode(); 
  renderRoom(); 
};
